services:
  - type: web
    name: sightline
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: PUBLISHED
        value: 1
      # Optional: restrict to your domain
      # - key: ALLOWED_HOSTS
      #   value: your-domain.onrender.com
    healthCheckPath: /api/health
    autoDeploy: false
